[package]
name = "epub-reader"
version = "1.0.0"
description = "A fast, secure EPUB 3 reader"
authors = ["you"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "epub_reader_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zip = { version = "8", default-features = false, features = ["deflate"] }
roxmltree = "0.21"
ammonia = "4"
rusqlite = { version = "0.40", features = ["bundled"] }
regex = "1"
encoding_rs = "0.8"
percent-encoding = "2"
url = "2"
base64 = "0.23.1"
tauri-plugin-single-instance = "2.0.0-rc.5"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
